[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carcasa"
version = "0.1.0"
description = "Zona publica y zona privada cifrada en el mismo equipo"
requires-python = ">=3.11"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "cryptography>=42",
    "argon2-cffi>=23",
    "psutil>=5.9",
    "watchdog>=4",
    "typer>=0.12",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
build = ["pyinstaller>=6"]

[project.scripts]
carcasa = "carcasa.cli:main"

[tool.setuptools.packages.find]
include = ["carcasa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "windows: requiere Windows real (se omite en otros sistemas)",
    "integration: modifica el entorno real; solo con --run-integration",
]
filterwarnings = ["ignore::DeprecationWarning"]
